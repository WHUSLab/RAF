[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RAF"
version = "0.1.0"
description = "Clean public runtime package for RAF."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "pyarrow",
]

[project.optional-dependencies]
hnsw = ["hnswlib"]

[project.scripts]
raf-run = "RAF.run_pipeline:main"
raf-experiments = "RAF.run_experiments:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["RAF"]
